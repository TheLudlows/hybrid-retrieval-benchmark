name: MIRACL API client portability

on:
  push:
    branches: [miracl-zh-benchmark]
    paths:
      - .github/workflows/miracl-api.yml
      - miracl_zh/**
      - doc_recall_v1/bench.py
  pull_request:
    branches: [miracl-zh-benchmark]
    paths:
      - .github/workflows/miracl-api.yml
      - miracl_zh/**
      - doc_recall_v1/bench.py

permissions:
  contents: read

jobs:
  client:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    env:
      PYTHONUTF8: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python miracl_zh/run_existing_services.py --help
      - run: python miracl_zh/bench.py --data miracl_zh/data/miracl-zh-100k verify
      - name: Check locking and UTF-8 checkpoints
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          from tempfile import TemporaryDirectory

          sys.path.insert(0, "miracl_zh")
          from run_llm_ingest_rerank import append_row, read_json
          from run_support import run_lock, save

          with TemporaryDirectory() as folder:
              lock = Path(folder, "run.lock")
              child = [
                  sys.executable, "-c",
                  "import sys; sys.path.insert(0, 'miracl_zh'); from pathlib import Path; "
                  "from run_support import run_lock\nwith run_lock(Path(sys.argv[1])): pass",
                  str(lock),
              ]
              with run_lock(lock):
                  blocked = subprocess.run(child, capture_output=True, timeout=10)
                  assert blocked.returncode != 0, blocked
                  assert b"Another process holds the run lock" in blocked.stderr, blocked
              subprocess.run(child, check=True, timeout=10)
              crash = child.copy()
              crash[2] = crash[2].replace(": pass", ": __import__('os')._exit(9)")
              assert subprocess.run(crash, timeout=10).returncode == 9
              with run_lock(lock):
                  pass

              status = Path(folder, "status.json")
              payload = {"query": "\u4e8c\u6218"}
              save(status, payload)
              assert read_json(status) == payload
              assert payload["query"].encode("utf-8") in status.read_bytes()

              journal = Path(folder, "progress.jsonl")
              append_row(journal, payload)
              assert b"\r\n" not in journal.read_bytes()
              assert read_json(journal) == payload
      - name: Check ContextBase configuration readback
        shell: python
        run: |
          import sys
          from types import SimpleNamespace
          from unittest.mock import Mock, patch

          sys.path.insert(0, "miracl_zh")
          import run_existing_services as client

          run = object.__new__(client.ExistingRun)
          args = SimpleNamespace(weknora_reranker_id="")
          contextbase = Mock(base="http://contextbase", scope="test")
          weknora = Mock(base="http://weknora", scope="test")
          weknora.request.return_value = {"data": {"question_generation_config": {"enabled": True}}}
          config = {
              "retain_extraction_mode": "concise", "enable_reranking": True,
              "enable_text_search": True, "enable_graph_retrieval": False,
              "enable_temporal_retrieval": False,
          }

          for response, expected in (
              ({"config": {}}, "administrator API key"),
              ({"config": {"enable_text_search": True}}, "retain_extraction_mode"),
              ({"config": {**config, "retain_extraction_mode": "chunks"}}, "Enable LLM fact extraction"),
              ({}, "did not return a Bank configuration object"),
          ):
              contextbase.request.return_value = response
              with patch.object(client.bench, "prior_api", return_value=contextbase) as prior_api:
                  try:
                      run.service_plan(args)
                  except ValueError as error:
                      assert expected in str(error), str(error)
                  else:
                      raise AssertionError(f"Preflight accepted invalid response: {response}")
                  prior_api.assert_called_once_with("contextbase")

          contextbase.request.return_value = {"config": config}
          with patch.object(client.bench, "prior_api", side_effect=[contextbase, weknora]):
              assert run.service_plan(args)["contextbase_readback"] == config
