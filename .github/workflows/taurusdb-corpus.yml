name: Build TaurusDB pilot corpus
on:
  push:
    branches: [taurusdb-pilot]
    paths:
      - .github/workflows/taurusdb-corpus.yml
      - taurusdb_retrieval_pilot/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml==5.4.0
      - run: python taurusdb_retrieval_pilot/build_corpus.py --output taurusdb-pilot-corpus
      - uses: actions/upload-artifact@v4
        with:
          name: taurusdb-pilot-corpus
          path: taurusdb-pilot-corpus/
          if-no-files-found: error
          retention-days: 3
